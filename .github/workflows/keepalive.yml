# Wakes the demo backend if it ever fell asleep. The gateway keeps itself
# awake (keepAwake in services/cmd/gateway), because GitHub runs scheduled
# jobs hours late and this alone let Render's free plan sleep after 15 minutes.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # a "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://flowscore-api-7nwl.onrender.com/healthz
