<style>body{margin:0}@keyframes fs-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fs-pulse{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes fs-ping{0%{transform:scale(1);opacity:0.75}100%{transform:scale(3);opacity:0}}@keyframes fs-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes fs-spin{to{transform:rotate(360deg)}}@keyframes fs-gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fs-gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.fs-in{animation:fs-in 0.7s cubic-bezier(0.2,0.7,0.2,1) both}.fs-card{transition:transform 0.3s cubic-bezier(0.2,0.7,0.2,1),border-color 0.3s}.fs-card:hover{transform:translateY(-4px);border-color:var(--fs-home)!important}.fs-press{transition:transform 0.14s ease,filter 0.2s,background-color 0.2s}.fs-press:hover{filter:brightness(1.08)}.fs-press:active{transform:scale(0.96)}.fs-link{transition:opacity 0.15s,background-color 0.2s}.fs-link:active{opacity:0.6}.fs-row:hover{background-color:var(--fs-s2)!important}.fs-bv{transform-origin:bottom;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bd{transform-origin:top;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bh{transform-origin:left;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-bhr{transform-origin:right;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-tw{transition:width 0.5s cubic-bezier(0.2,0.7,0.2,1),left 0.22s ease,background-color 0.22s}.fs-ping{position:relative}.fs-ping::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:fs-ping 1.6s ease-out infinite}.fs-pulse{animation:fs-pulse 1.6s ease-in-out infinite}.fs-marq{animation:fs-marq 38s linear infinite}.fs-marq:hover{animation-play-state:paused}.fs-spin{animation:fs-spin 0.9s linear infinite}.fs-arr{transition:transform 0.25s cubic-bezier(0.2,0.7,0.2,1)}.fs-press:hover .fs-arr,.fs-link:hover .fs-arr{transform:translateX(4px)}.fs-photo svg{transition:transform 0.5s cubic-bezier(0.2,0.7,0.2,1)}a:hover .fs-photo svg,.fs-photo:hover svg{transform:scale(1.07)}.fs-wcol{cursor:crosshair}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</helmet>
<div style="--fs-home:{{c.home}};--fs-s2:{{c.surface2}};width:1440px;height:900px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;font-family:'Onest',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-feature-settings:'tnum' 0;-webkit-font-smoothing:antialiased;color:{{c.text}};background:{{c.bg}};">
<div style="flex-grow:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);"><section style="background:{{c.surface}};border-right:1px solid {{c.line}};padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;"><a class="fs-link" href="Main.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:{{c.text}};"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" stroke="{{c.home}}" stroke-width="2"></rect><path d="M6 16h4l2.5-6.5 4 12 2.5-5.5H24" stroke="{{c.home}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;letter-spacing:0.05em;">FLOWSCORE</span></a><div style="display:flex;flex-direction:column;gap:28px;"><h1 style="margin:0;font-size:64px;font-weight:700;letter-spacing:-0.025em;line-height:1.05;">Почувствуй, кто <span style="color:{{c.home}};">владеет игрой</span></h1><div style="display:flex;gap:4px;height:201px;"><sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><div style="flex:1 1 0;display:flex;flex-direction:column;"><div style="height:100px;display:flex;align-items:flex-end;"><div class="fs-bv" style="width:100%;height:{{b.up}};background:{{b.uc}};border-radius:3px 3px 0 0;"></div></div><div style="height:1px;background:{{c.line}};"></div><div style="height:100px;display:flex;align-items:flex-start;"><div class="fs-bd" style="width:100%;height:{{b.down}};background:{{b.dc}};border-radius:0 0 3px 3px;"></div></div></div></sc-for></div></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;"><div style="display:flex;flex-direction:column;gap:8px;"><span style="display:flex;color:{{c.home}};"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg></span><span style="font-size:15px;font-weight:600;">Flow в реальном времени</span></div><div style="display:flex;flex-direction:column;gap:8px;"><span style="display:flex;color:{{c.home}};"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"></path></svg></span><span style="font-size:15px;font-weight:600;">AI объясняет каждый скачок</span></div><div style="display:flex;flex-direction:column;gap:8px;"><span style="display:flex;color:{{c.home}};"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></span><span style="font-size:15px;font-weight:600;">Симулятор «Что, если…?»</span></div></div></section><section style="display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px;position:relative;"><div style="position:absolute;top:24px;right:24px;"><button class="fs-press" type="button" aria-label="Переключить тему" onClick="{{toggleTheme}}" style="width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid {{c.line}};background:{{c.surface}};color:{{c.text}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;"><sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button></div><div style="width:420px;display:flex;flex-direction:column;gap:22px;"><div role="tablist" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px;border-radius:11px;background:{{c.fill}};"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button class="fs-press" type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height:44px;border:0;border-radius:10px;background:{{t.bg}};color:{{t.fg}};font:inherit;font-size:15px;font-weight:600;cursor:pointer;">{{t.label}}</button></sc-for></div><div style="display:flex;flex-direction:column;gap:14px;"><sc-if value="{{isReg}}" hint-placeholder-val="{{false}}"><label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:{{c.muted}};">Имя<input type="text" autocomplete="name" placeholder="Как к тебе обращаться" style="height:48px;padding:0 14px;box-sizing:border-box;border-radius:12px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.text}};font:inherit;font-size:15px;width:100%;"></label></sc-if><label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:{{c.muted}};">Эл. почта<input type="email" autocomplete="email" placeholder="you@mail.kz" style="height:48px;padding:0 14px;box-sizing:border-box;border-radius:12px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.text}};font:inherit;font-size:15px;width:100%;"></label><label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:{{c.muted}};"><span style="display:flex;justify-content:space-between;"><span>Пароль</span><sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}"><a class="fs-link" href="#" style="color:{{c.home}};text-decoration:none;">Забыли пароль?</a></sc-if></span><span style="position:relative;display:block;"><input type="{{pwType}}" autocomplete="current-password" placeholder="Минимум 8 символов" style="height:48px;padding:0 14px;box-sizing:border-box;border-radius:12px;border:1px solid {{c.line}};background:{{c.bg}};color:{{c.text}};font:inherit;font-size:15px;width:100%;padding-right:52px;"><button class="fs-press" type="button" aria-label="Показать пароль" onClick="{{togglePw}}" style="position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;color:{{c.muted}};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label><sc-if value="{{isReg}}" hint-placeholder-val="{{false}}"><span style="font-size:12px;color:{{c.muted}};">Не короче 8 символов и хотя бы одна цифра.</span></sc-if></div><button class="fs-press" type="button" onClick="{{submit}}" disabled="{{busy}}" style="height:44px;padding:0 18px;border-radius:12px;border:0;background:{{c.accentFill}};color:{{c.onAccent}};font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-sizing:border-box;height:52px;font-size:15px;width:100%;"><sc-if value="{{idle}}" hint-placeholder-val="{{true}}">{{cta}}</sc-if><sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><span style="display:flex;align-items:center;gap:10px;"><svg class="fs-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"></path></svg>Проверяем…</span></sc-if></button><p style="margin:0;font-size:12px;line-height:1.5;color:{{c.muted}};text-align:center;">Продолжая, ты соглашаешься с условиями сервиса и политикой конфиденциальности.</p></div></section></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {

pal(t){ return t==='light'
 ? {bg:'#F5F3F2',surface:'#FFFFFF',surface2:'#EFEBEA',line:'#E0DAD8',text:'#161213',muted:'#5E5557',faint:'#B3AAA9',home:'#D0142A',away:'#2F6A96',homeSoft:'rgba(208,20,42,0.09)',awaySoft:'rgba(47,106,150,0.10)',onHome:'#FFFFFF',onAway:'#FFFFFF',live:'#D0142A',liveSoft:'rgba(208,20,42,0.09)',track:'#EAE5E3',accentFill:'#D0142A',onAccent:'#FFFFFF',ok:'#248A3D',fill:'rgba(120,120,128,0.16)',segSel:'#FFFFFF',barBg:'rgba(245,243,242,0.82)',sep:'rgba(60,60,67,0.18)'}
 : {bg:'#0B0909',surface:'#151112',surface2:'#1F1A1B',line:'#2E2728',text:'#F5EFEE',muted:'#A89E9F',faint:'#5F5556',home:'#FF3B4A',away:'#8FB8D6',homeSoft:'rgba(255,59,74,0.13)',awaySoft:'rgba(143,184,214,0.13)',onHome:'#1C0305',onAway:'#0A1A26',live:'#FF3B4A',liveSoft:'rgba(255,59,74,0.13)',track:'#241E1F',accentFill:'#D9162B',onAccent:'#FFFFFF',ok:'#30D158',fill:'rgba(120,120,128,0.30)',segSel:'#5B5456',barBg:'rgba(11,9,9,0.78)',sep:'rgba(84,84,88,0.55)'}; }
st(k,d){ const s=this.state; return (s && s[k]!==undefined) ? s[k] : d; }
thm(){ return this.st('theme', this.props.theme || 'light'); }
componentDidMount(){ const t0=Date.now(); const tick=()=>{ const p=Math.min(1,(Date.now()-t0)/1200); this.setState({k:p}); if(p<1) this._r=requestAnimationFrame(tick); }; this._r=requestAnimationFrame(tick); if(this.live) this._i=setInterval(()=>this.live(),2600); }
componentWillUnmount(){ cancelAnimationFrame(this._r); clearInterval(this._i); }
ez(){ const k=this.st('k',0); return 1-Math.pow(1-k,3); }
cn(v,d){ return (v*this.ez()).toFixed(d||0); }
bs(){ const t=this.thm(); return { c:this.pal(t), isDark:t==='dark', isLight:t==='light', toggleTheme:()=>this.setState({theme:t==='dark'?'light':'dark'}) }; }

au(c){ const mode=this.st('mode','login'); const busy=this.st('busy',false); const pw=this.st('pw',false);
 const tabs=[['login','Вход'],['reg','Регистрация']].map(x=>({label:x[1],pick:()=>this.setState({mode:x[0],busy:false}),sel:x[0]===mode?'true':'false',bg:x[0]===mode?c.segSel:'transparent',fg:x[0]===mode?c.text:c.muted}));
 const bars=[]; for(let i=0;i<40;i++){ const v=Math.sin(i/3.2)*38+Math.sin(i/1.3)*14+(i>26?30:0); bars.push({up:Math.max(2,Math.round(Math.max(v,0)*1.4))+'px',down:Math.max(2,Math.round(Math.max(-v,0)*1.4))+'px',uc:v>0?c.home:c.line,dc:v<0?c.away:c.line}); }
 return {tabs,isLogin:mode==='login',isReg:mode==='reg',busy,idle:!busy,pwType:pw?'text':'password',togglePw:()=>this.setState({pw:!pw}),submit:()=>{ this.setState({busy:true}); setTimeout(()=>this.setState({busy:false}),1800); },bars,cta:mode==='login'?'Войти':'Создать аккаунт'};
}
renderVals(){ const b=this.bs(); return Object.assign(b,this.au(b.c)); }

}
</script>
