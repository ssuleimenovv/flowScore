# Pings the demo backend every 10 minutes: Render's free plan puts a service to
# sleep after 15 minutes without requests, and waking it takes up to a minute.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # a "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://flowscore-api-7nwl.onrender.com/healthz
