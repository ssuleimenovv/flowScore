<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FlowScore — Онбординг · extended-v · светлая</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&amp;family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}@keyframes fs-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fs-pulse{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes fs-ping{0%{transform:scale(1);opacity:0.75}100%{transform:scale(3);opacity:0}}@keyframes fs-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes fs-spin{to{transform:rotate(360deg)}}@keyframes fs-gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fs-gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.fs-in{animation:fs-in 0.7s cubic-bezier(0.2,0.7,0.2,1) both}.fs-card{transition:transform 0.3s cubic-bezier(0.2,0.7,0.2,1),border-color 0.3s}.fs-card:hover{transform:translateY(-4px);border-color:var(--fs-home)!important}.fs-press{transition:transform 0.14s ease,filter 0.2s,background-color 0.2s}.fs-press:hover{filter:brightness(1.08)}.fs-press:active{transform:scale(0.96)}.fs-link{transition:opacity 0.15s,background-color 0.2s}.fs-link:active{opacity:0.6}.fs-row:hover{background-color:var(--fs-s2)!important}.fs-bv{transform-origin:bottom;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bd{transform-origin:top;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bh{transform-origin:left;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-bhr{transform-origin:right;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-tw{transition:width 0.5s cubic-bezier(0.2,0.7,0.2,1),left 0.22s ease,background-color 0.22s}.fs-ping{position:relative}.fs-ping::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:fs-ping 1.6s ease-out infinite}.fs-pulse{animation:fs-pulse 1.6s ease-in-out infinite}.fs-marq{animation:fs-marq 38s linear infinite}.fs-marq:hover{animation-play-state:paused}.fs-spin{animation:fs-spin 0.9s linear infinite}.fs-arr{transition:transform 0.25s cubic-bezier(0.2,0.7,0.2,1)}.fs-press:hover .fs-arr,.fs-link:hover .fs-arr{transform:translateX(4px)}.fs-photo svg{transition:transform 0.5s cubic-bezier(0.2,0.7,0.2,1)}a:hover .fs-photo svg,.fs-photo:hover svg{transform:scale(1.07)}.fs-wcol{cursor:crosshair}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</helmet>

<div style="--fs-home:{{c.home}};--fs-s2:{{c.surface2}};width:1440px;height:900px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;font-family:'Onest',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-feature-settings:'tnum' 0;-webkit-font-smoothing:antialiased;color:{{c.text}};background:{{c.bg}};">
<div style="flex-grow:1;display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);"><section style="background:{{c.surface}};border-right:1px solid {{c.line}};padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;"><span style="display:flex;align-items:center;gap:10px;"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" stroke="{{c.home}}" stroke-width="2"></rect><path d="M6 16h4l2.5-6.5 4 12 2.5-5.5H24" stroke="{{c.home}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:28px;letter-spacing:0.05em;">FLOWSCORE</span></span><div style="display:flex;flex-direction:column;gap:20px;"><span><span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;border:1px dashed {{c.home}};color:{{c.home}};font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;letter-spacing:0.04em;">extended-v</span></span><h1 style="margin:0;font-size:60px;font-weight:700;letter-spacing:-0.025em;line-height:1.05;">Собери <span style="color:{{c.home}};">свою ленту</span></h1><p style="margin:0;font-size:17px;line-height:1.5;color:{{c.muted}};max-width:440px;">Три шага: турниры, команды и что присылать. Всё можно поменять потом в профиле.</p></div><ol aria-label="Шаги" style="list-style:none;margin:0;padding:0;display:flex;gap:16px;"><sc-for list="{{steps}}" as="s" hint-placeholder-count="3"><li aria-current="{{s.cur}}" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:{{s.col}};"><span style="width:24px;height:24px;border-radius:50%;border:2px solid {{s.col}};font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">{{s.n}}</span>{{s.label}}</li></sc-for></ol></section><section style="padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;"><sc-if value="{{isL}}" hint-placeholder-val="{{true}}"><div style="display:flex;flex-direction:column;gap:14px;"><h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;font-size:28px;">Какие турниры смотришь?</h2><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;"><sc-for list="{{leagues}}" as="l" hint-placeholder-count="8"><button class="fs-press" type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="min-height:76px;padding:12px 14px;border-radius:14px;border:1.5px solid {{l.bd}};background:{{l.bg}};color:{{c.text}};font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;"><span style="display:flex;justify-content:space-between;align-items:center;width:100%;"><span style="font-size:15px;font-weight:600;">{{l.label}}</span><sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><span style="color:{{c.home}};display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if></span><span style="font-size:12px;color:{{c.muted}};">{{l.sub}}</span></button></sc-for></div></div></sc-if><sc-if value="{{isT}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:14px;"><h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;font-size:28px;">Любимые команды</h2><label style="display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:{{c.surface}};border:1px solid {{c.line}};color:{{c.muted}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Найти команду" aria-label="Найти команду" style="flex-grow:1;border:0;background:transparent;color:{{c.text}};font:inherit;font-size:15px;outline:none;"></label><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;"><sc-for list="{{teamList}}" as="t" hint-placeholder-count="9"><button class="fs-press" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height:96px;padding:10px;border-radius:14px;border:1.5px solid {{t.bd}};background:{{t.bg}};color:{{c.text}};font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;"><span style="width:38px;height:38px;border-radius:12px;background:{{c.surface2}};font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;">{{t.code}}</span><span style="font-size:13px;font-weight:600;text-align:center;">{{t.label}}</span></button></sc-for></div></div></sc-if><sc-if value="{{isA}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:6px;"><h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.2;font-size:28px;padding-bottom:8px;">О чём сообщать?</h2><sc-for list="{{alertList}}" as="a" hint-placeholder-count="4"><button class="fs-press" type="button" role="switch" aria-checked="{{a.pressed}}" onClick="{{a.pick}}" style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:10px 0;border:0;border-top:1px solid {{c.line}};background:transparent;color:{{c.text}};font:inherit;text-align:left;cursor:pointer;"><span style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:15px;font-weight:600;">{{a.label}}</span><span style="font-size:13px;color:{{c.muted}};">{{a.sub}}</span></span><span style="position:relative;width:51px;height:31px;flex-shrink:0;border-radius:999px;background:{{a.tbg}};"><span class="fs-tw" style="position:absolute;top:2px;left:{{a.knob}};width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,0.2);"></span></span></button></sc-for></div></sc-if><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;"><button class="fs-press" type="button" onClick="{{back}}" style="height:44px;padding:0 18px;border-radius:12px;border:1px solid {{c.line}};background:transparent;color:{{c.text}};font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-sizing:border-box;">Назад</button><span style="font-size:13px;color:{{c.muted}};">выбрано: {{count}}</span><sc-if value="{{notLast}}" hint-placeholder-val="{{true}}"><button class="fs-press" type="button" onClick="{{next}}" style="height:44px;padding:0 20px;border-radius:12px;border:0;background:{{c.accentFill}};color:{{c.onAccent}};font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-sizing:border-box;">Дальше</button></sc-if><sc-if value="{{isLast}}" hint-placeholder-val="{{false}}"><a class="fs-press" href="Main.dc.html" style="height:44px;padding:0 20px;border-radius:12px;border:0;background:{{c.accentFill}};color:{{c.onAccent}};font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-sizing:border-box;">Готово</a></sc-if></div></section></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "light"}, "$preview": {"width": 1440, "height": 900}}'>

class Component extends DCLogic {

pal(t){ return t==='light'
 ? {bg:'#F5F3F2',surface:'#FFFFFF',surface2:'#EFEBEA',line:'#E0DAD8',text:'#161213',muted:'#5E5557',faint:'#B3AAA9',home:'#D0142A',away:'#2F6A96',homeSoft:'rgba(208,20,42,0.09)',awaySoft:'rgba(47,106,150,0.10)',onHome:'#FFFFFF',onAway:'#FFFFFF',live:'#D0142A',liveSoft:'rgba(208,20,42,0.09)',track:'#EAE5E3',accentFill:'#D0142A',onAccent:'#FFFFFF',ok:'#248A3D',fill:'rgba(120,120,128,0.16)',segSel:'#FFFFFF',barBg:'rgba(245,243,242,0.82)',sep:'rgba(60,60,67,0.18)'}
 : {bg:'#0B0909',surface:'#151112',surface2:'#1F1A1B',line:'#2E2728',text:'#F5EFEE',muted:'#A89E9F',faint:'#5F5556',home:'#FF3B4A',away:'#8FB8D6',homeSoft:'rgba(255,59,74,0.13)',awaySoft:'rgba(143,184,214,0.13)',onHome:'#1C0305',onAway:'#0A1A26',live:'#FF3B4A',liveSoft:'rgba(255,59,74,0.13)',track:'#241E1F',accentFill:'#D9162B',onAccent:'#FFFFFF',ok:'#30D158',fill:'rgba(120,120,128,0.30)',segSel:'#5B5456',barBg:'rgba(11,9,9,0.78)',sep:'rgba(84,84,88,0.55)'}; }
st(k,d){ const s=this.state; return (s && s[k]!==undefined) ? s[k] : d; }
thm(){ return this.st('theme', this.props.theme || 'light'); }
componentDidMount(){ const t0=Date.now(); const tick=()=>{ const p=Math.min(1,(Date.now()-t0)/1200); this.setState({k:p}); if(p<1) this._r=requestAnimationFrame(tick); }; this._r=requestAnimationFrame(tick); if(this.live) this._i=setInterval(()=>this.live(),2600); }
componentWillUnmount(){ cancelAnimationFrame(this._r); clearInterval(this._i); }
ez(){ const k=this.st('k',0); return 1-Math.pow(1-k,3); }
cn(v,d){ return (v*this.ez()).toFixed(d||0); }
bs(){ const t=this.thm(); return { c:this.pal(t), isDark:t==='dark', isLight:t==='light', toggleTheme:()=>this.setState({theme:t==='dark'?'light':'dark'}) }; }

ld(c){
 const step=this.st('step',0); const picked=this.st('picked',{epl:true,ucl:true}); const teams=this.st('teams',{MCI:true}); const alerts=this.st('alerts',{goal:true,spike:true});
 const toggle=(key,obj,id)=>()=>this.setState({[key]:Object.assign({},obj,{[id]:!obj[id]})});
 const steps=['Лиги','Команды','Уведомления'].map((s,i)=>({n:String(i+1),label:s,on:i<=step,col:i<=step?c.home:c.faint,cur:i===step?'step':'false'}));
 const L=[['epl','Премьер-лига','Англия'],['laliga','Ла Лига','Испания'],['seriea','Серия A','Италия'],['bundes','Бундеслига','Германия'],['ligue1','Лига 1','Франция'],['ucl','Лига чемпионов','УЕФА'],['uel','Лига Европы','УЕФА'],['kpl','КПЛ','Казахстан']];
 const leagues=L.map(l=>({label:l[1],sub:l[2],pick:toggle('picked',picked,l[0]),pressed:picked[l[0]]?'true':'false',bd:picked[l[0]]?c.home:c.line,bg:picked[l[0]]?c.homeSoft:c.surface,on:!!picked[l[0]]}));
 const TT=[['MCI','Манчестер Сити'],['ARS','Арсенал'],['LIV','Ливерпуль'],['RMA','Реал Мадрид'],['BAR','Барселона'],['BAY','Бавария'],['INT','Интер'],['KAI','Кайрат'],['PSG','ПСЖ']];
 const teamList=TT.map(t=>({code:t[0],label:t[1],pick:toggle('teams',teams,t[0]),pressed:teams[t[0]]?'true':'false',bd:teams[t[0]]?c.home:c.line,bg:teams[t[0]]?c.homeSoft:c.surface,on:!!teams[t[0]]}));
 const A=[['goal','Голы','мгновенно, по избранным командам'],['start','Начало матча','за 15 минут и в момент свистка'],['spike','Скачки Flow','когда поток меняется на 15+ пунктов за 5 минут'],['final','AI-разбор после матча','через минуту после финального свистка']];
 const alertList=A.map(a=>({label:a[1],sub:a[2],pick:toggle('alerts',alerts,a[0]),pressed:alerts[a[0]]?'true':'false',tbg:alerts[a[0]]?c.ok:c.fill,knob:alerts[a[0]]?'22px':'2px'}));
 const next=()=>this.setState({step:Math.min(2,step+1)}), back=()=>this.setState({step:Math.max(0,step-1)});
 const count=Object.values(picked).filter(Boolean).length+Object.values(teams).filter(Boolean).length;
 return {steps,leagues,teamList,alertList,isL:step===0,isT:step===1,isA:step===2,notLast:step<2,isLast:step===2,next,back,count:String(count)};
}

renderVals(){ const b=this.bs(); return Object.assign(b,this.ld(b.c)); }

}

</script>
</body>
</html>
