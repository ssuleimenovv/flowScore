<style>body{margin:0}@keyframes fs-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fs-pulse{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes fs-ping{0%{transform:scale(1);opacity:0.75}100%{transform:scale(3);opacity:0}}@keyframes fs-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes fs-spin{to{transform:rotate(360deg)}}@keyframes fs-gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fs-gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.fs-in{animation:fs-in 0.7s cubic-bezier(0.2,0.7,0.2,1) both}.fs-card{transition:transform 0.3s cubic-bezier(0.2,0.7,0.2,1),border-color 0.3s}.fs-card:hover{transform:translateY(-4px);border-color:var(--fs-home)!important}.fs-press{transition:transform 0.14s ease,filter 0.2s,background-color 0.2s}.fs-press:hover{filter:brightness(1.08)}.fs-press:active{transform:scale(0.96)}.fs-link{transition:opacity 0.15s,background-color 0.2s}.fs-link:active{opacity:0.6}.fs-row:hover{background-color:var(--fs-s2)!important}.fs-bv{transform-origin:bottom;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bd{transform-origin:top;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bh{transform-origin:left;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-bhr{transform-origin:right;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-tw{transition:width 0.5s cubic-bezier(0.2,0.7,0.2,1),left 0.22s ease,background-color 0.22s}.fs-ping{position:relative}.fs-ping::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:fs-ping 1.6s ease-out infinite}.fs-pulse{animation:fs-pulse 1.6s ease-in-out infinite}.fs-marq{animation:fs-marq 38s linear infinite}.fs-marq:hover{animation-play-state:paused}.fs-spin{animation:fs-spin 0.9s linear infinite}.fs-arr{transition:transform 0.25s cubic-bezier(0.2,0.7,0.2,1)}.fs-press:hover .fs-arr,.fs-link:hover .fs-arr{transform:translateX(4px)}.fs-photo svg{transition:transform 0.5s cubic-bezier(0.2,0.7,0.2,1)}a:hover .fs-photo svg,.fs-photo:hover svg{transform:scale(1.07)}.fs-wcol{cursor:crosshair}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>

cursor:pointer;"><sc-if value="{{isDark}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if><sc-if value="{{isLight}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if></button></div></div></header>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "$preview": {"width": 390, "height": 1420}}'>
class Component extends DCLogic {

pal(t){ return t==='light'
 ? {bg:'#F5F3F2',surface:'#FFFFFF',surface2:'#EFEBEA',line:'#E0DAD8',text:'#161213',muted:'#5E5557',faint:'#B3AAA9',home:'#D0142A',away:'#2F6A96',homeSoft:'rgba(208,20,42,0.09)',awaySoft:'rgba(47,106,150,0.10)',onHome:'#FFFFFF',onAway:'#FFFFFF',live:'#D0142A',liveSoft:'rgba(208,20,42,0.09)',track:'#EAE5E3',accentFill:'#D0142A',onAccent:'#FFFFFF',ok:'#248A3D',fill:'rgba(120,120,128,0.16)',segSel:'#FFFFFF',barBg:'rgba(245,243,242,0.82)',sep:'rgba(60,60,67,0.18)'}
 : {bg:'#0B0909',surface:'#151112',surface2:'#1F1A1B',line:'#2E2728',text:'#F5EFEE',muted:'#A89E9F',faint:'#5F5556',home:'#FF3B4A',away:'#8FB8D6',homeSoft:'rgba(255,59,74,0.13)',awaySoft:'rgba(143,184,214,0.13)',onHome:'#1C0305',onAway:'#0A1A26',live:'#FF3B4A',liveSoft:'rgba(255,59,74,0.13)',track:'#241E1F',accentFill:'#D9162B',onAccent:'#FFFFFF',ok:'#30D158',fill:'rgba(120,120,128,0.30)',segSel:'#5B5456',barBg:'rgba(11,9,9,0.78)',sep:'rgba(84,84,88,0.55)'}; }

componentWillUnmount(){ cancelAnimationFrame(this._r); clearInterval(this._i); }

bs(){ const t=this.thm(); return { c:this.pal(t), isDark:t==='dark', isLight:t==='light', toggleTheme:()=>this.setState({theme:t==='dark'?'light':'dark'}) }; }

 const leagues=[['epl','Премьер-лига'],['laliga','Ла Лига'],['seriea','Серия A'],['bundes','Бундеслига'],['kpl','КПЛ']].map(x=>({label:x[1],pick:()=>this.setState({lg:x[0]}),pressed:x[0]===lg?'true':'false',bg:x[0]===lg?c.text:c.surface,fg:x[0]===lg?c.bg:c.text,bd:x[0]===lg?c.text:c.line}));
 const T=[['Ливерпуль','LIV',7,6,1,0,'17:5',19,74],['Манчестер Сити','MCI',7,5,2,0,'16:6',17,68],['Арсенал','ARS',7,5,1,1,'14:6',16,63],['Челси','CHE',7,4,2,1,'13:8',14,59],['Астон Вилла','AVL',7,4,1,2,'11:9',13,55],['Тоттенхэм','TOT',7,3,2,2,'12:10',11,57],['Ньюкасл','NEW',7,3,2,2,'9:8',11,52],['Брайтон','BHA',7,3,1,3,'10:11',10,54],['Фулхэм','FUL',7,2,3,2,'8:9',9,47],['Вест Хэм','WHU',7,2,1,4,'8:13',7,44]];
 const table=T.map((x,i)=>({pos:String(i+1),name:x[0],code:x[1],p:String(x[2]),w:String(x[3]),d:String(x[4]),l:String(x[5]),g:x[6],pts:String(x[7]),flow:String(x[8]),fw:x[8]+'%',zone:i<4?c.home:(i===4?c.away:c.track),rowBg:x[1]==='MCI'?c.surface2:'transparent'}));
