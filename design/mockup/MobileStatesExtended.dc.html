<style>body{margin:0}@keyframes fs-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fs-pulse{0%,100%{opacity:1}50%{opacity:0.4}}@keyframes fs-ping{0%{transform:scale(1);opacity:0.75}100%{transform:scale(3);opacity:0}}@keyframes fs-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@keyframes fs-spin{to{transform:rotate(360deg)}}@keyframes fs-gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes fs-gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}.fs-in{animation:fs-in 0.7s cubic-bezier(0.2,0.7,0.2,1) both}.fs-card{transition:transform 0.3s cubic-bezier(0.2,0.7,0.2,1),border-color 0.3s}.fs-card:hover{transform:translateY(-4px);border-color:var(--fs-home)!important}.fs-press{transition:transform 0.14s ease,filter 0.2s,background-color 0.2s}.fs-press:hover{filter:brightness(1.08)}.fs-press:active{transform:scale(0.96)}.fs-link{transition:opacity 0.15s,background-color 0.2s}.fs-link:active{opacity:0.6}.fs-row:hover{background-color:var(--fs-s2)!important}.fs-bv{transform-origin:bottom;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bd{transform-origin:top;animation:fs-gy 0.8s cubic-bezier(0.2,0.7,0.2,1) both;transition:opacity 0.15s}.fs-bh{transform-origin:left;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-bhr{transform-origin:right;animation:fs-gx 0.9s cubic-bezier(0.2,0.7,0.2,1) both}.fs-tw{transition:width 0.5s cubic-bezier(0.2,0.7,0.2,1),left 0.22s ease,background-color 0.22s}.fs-ping{position:relative}.fs-ping::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:fs-ping 1.6s ease-out infinite}.fs-pulse{animation:fs-pulse 1.6s ease-in-out infinite}.fs-marq{animation:fs-marq 38s linear infinite}.fs-marq:hover{animation-play-state:paused}.fs-spin{animation:fs-spin 0.9s linear infinite}.fs-arr{transition:transform 0.25s cubic-bezier(0.2,0.7,0.2,1)}.fs-press:hover .fs-arr,.fs-link:hover .fs-arr{transform:translateX(4px)}.fs-p ="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg></sc-if></span><span style="font-size:17px;font-weight:600;">{{s.t}}</span><span style="font-size:14px;line-height:1.45;color:{{c.muted}};">{{s.d}}</span><sc-if value="{{s.busy}}" hint-placeholder-val="{{false}}"><span style="width:100%;height:6px;border-radius:999px;background:{{c.track}};overflow:hidden;"><span class="fs-bh" style="display:block;height:100%;width:62%;background:{{c.home}};"></span></span></sc-if><sc-if value="{{s.hasA}}" hint-placeholder-val="{{false}}"><button class="fs-press" type="button" style="height:44px;padding:0 18px;border-radius:12px;border:1px solid {{c.line}};background:transparent;color:{{c.text}};font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;box-sizing:border-box;margin-top:auto;height:40px;">{{s.a}}</button></sc-if></section></sc-for></div></div>

<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "$preview": {"width": 390, "height": 2140}}'>

class Component extends DCLogic {

pal(t){ return t==='light'
 ? {bg:'#F5F3F2',surface:'#FFFFFF',surface2:'#EFEBEA',line:'#E0DAD8',text:'#161213',muted:'#5E5557',faint:'#B3AAA9',home:'#D0142A',away:'#2F6A96',homeSoft:'rgba(208,20,42,0.09)',awaySoft:'rgba(47,106,150,0.10)',onHome:'#FFFFFF',onAway:'#FFFFFF',live:'#D0142A',liveSoft:'rgba(208,20,42,0.09)',track:'#EAE5E3',accentFill:'#D0142A',onAccent:'#FFFFFF',ok:'#248A3D',fill:'rgba(120,120,128,0.16)',segSel:'#FFFFFF',barBg:'rgba(245,243,242,0.82)',sep:'rgba(60,60,67,0.18)'}
 : {bg:'#0B0909',surface:'#151112',surface2:'#1F1A1B',line:'#2E2728',text:'#F5EFEE',muted:'#A89E9F',faint:'#5F5556',home:'#FF3B4A',away:'#8FB8D6',homeSoft:'rgba(255,59,74,0.13)',awaySoft:'rgba(143,184,214,0.13)',onHome:'#1C0305',onAway:'#0A1A26',live:'#FF3B4A',liveSoft:'rgba(255,59,74,0.13)',track:'#241E1F',accentFill:'#D9162B',onAccent:'#FFFFFF',ok:'#30D158',fill:'rgba(120,120,128,0.30)',segSel:'#5B5456',barBg:'rgba(11,9,9,0.78)',sep:'rgba(84,84,88,0.55)'}; }
st(k,d){ const s=this.state; return (s && s[k]!==undefined) ? s[k] : d; }
thm(){ return this.st('theme', this.props.theme || 'dark'); }
componentDidMount(){ const t0=Date.now(); const tick=()=>{ const p=Math.min(1,(Date.now()-t0)/1200); this.setState({k:p}); if(p<1) this._r=requestAnimationFrame(tick); }; this._r=requestAnimationFrame(tick); if(this.live) this._i=setInterval(()=>this.live(),2600); }
componentWillUnmount(){ cancelAnimationFrame(this._r); clearInterval(this._i); }
ez(){ const k=this.st('k',0); return 1-Math.pow(1-k,3); }
cn(v,d){ return (v*this.ez()).toFixed(d||0); }
bs(){ const t=this.thm(); return { c:this.pal(t), isDark:t==='dark', isLight:t==='light', toggleTheme:()=>this.setState({theme:t==='dark'?'light':'dark'}) }; }

ld(c){
 const S=[['users','Составы ещё не объявлены','Появятся примерно за час до начала.','Напомнить','Матч'],
  ['coin','Коэффициентов нет','На этот матч линия не открыта. Наш прогноз всё равно есть.','','Матч'],
  ['target','Ударов пока нет','Карта заполнится после первого удара.','','Матч'],
  ['news','Новостей нет','О матче пока не писали.','','Матч'],
  ['tree','У турнира нет таблицы','Кубок Англии играется на выбывание.','Открыть сетку','Турниры'],
  ['cal','В этот день матчей нет','Ближайшие — в пятницу, 16 октября.','К пятнице','Главная'],
  ['clock','Считаем статистику сезона','Прогоняем 60 сыгранных матчей через Flow. Обычно пара минут.','','Лига'],
  ['alert','Турнир не загрузился','ESPN не ответил. Попробуем ещё раз через 30 секунд.','Повторить','Турниры']];
 const states=S.map((s,i)=>({icon:s[0],t:s[1],d:s[2],a:s[3],hasA:s[3]!=='',w:s[4],busy:s[0]==='clock',bad:s[0]==='alert',ic:s[0]==='alert'?c.home:c.muted,is_users:s[0]==='users',is_coin:s[0]==='coin',is_target:s[0]==='target',is_news:s[0]==='news',is_tree:s[0]==='tree',is_cal:s[0]==='cal',is_clock:s[0]==='clock',is_alert:s[0]==='alert'}));
 return {states,ic:states.map(s=>s.icon)};
}

renderVals(){ const b=this.bs(); return Object.assign(b,this.ld(b.c)); }

}
